name: Build & Push Image

# 只负责构建并推送镜像到腾讯云 TCR。
# 部署由服务器本机完成（1Panel 计划任务执行 deploy/deploy.sh），
# 不需要从 GitHub 反连服务器，避免境外 runner 的 IP 被安全策略拦截。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: c-nav-release
  cancel-in-progress: false

env:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: cnav
  IMAGE: c-nav

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          image="${REGISTRY}/${NAMESPACE}/${IMAGE}"
          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "tags=${image}:latest,${image}:sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "将推送: ${image}:latest  ${image}:sha-${short_sha}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # runner 在境外，推到腾讯云偶尔会被限速/断流；失败时用缓存整体重试一次
      - name: Retry push once
        if: failure()
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 镜像"
            echo '```'
            tr ',' '\n' <<< "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "**下一步**：在服务器 1Panel → 计划任务 → 点「执行」拉取新镜像上线。"
          } >> "$GITHUB_STEP_SUMMARY"
